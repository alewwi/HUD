<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Значки — стенд</title>
<link rel="stylesheet" href="../../css/all.css?v=23.88.2">
<style>body { margin: 0; padding: 12px; background: #1d1a22; color: #e8dff0; font: 12px system-ui, sans-serif; }
.bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; padding: 6px 0 10px; background: #1d1a22; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; }
.c { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 6px; border-radius: 8px; background: rgba(255,255,255,.04); }
.c .hud-ico { font-size: 30px; color: #d7b9ff; } .c b { font-weight: 500; font-size: 11px; opacity: .8; } .c i { font-style: normal; font-size: 14px; }
.c.new { box-shadow: inset 0 0 0 1px rgba(215,185,255,.35); }</style></head>
<body><div class="bar"><select id="st"><option>line</option><option>duotone</option><option>pixel</option><option>ink</option><option>rounded</option></select><label><input type="checkbox" id="only" checked> только новые</label></div><div class="grid" id="g"></div>
<script type="module">
const V = '?v=23.88.2&t=' + Date.now();
const { ЕЩЁ, ЕЩЁ_ЭМОДЗИ } = await import('../../render/icon-paths.js' + V);
const И = await import('../../render/hud-icons.js' + V);
document.body.insertAdjacentHTML('beforeend', И.разметкаСпрайта());
const эмодзи = {}; for (const [э, и] of Object.entries(ЕЩЁ_ЭМОДЗИ)) (эмодзи[и] ||= []).push(э);
const все = [...document.querySelectorAll('#hud-icon-sprite symbol')].map(s => s.id.slice(6));
const рисовать = () => {
  const только = document.getElementById('only').checked;
  document.getElementById('g').innerHTML = все.filter(и => !только || и in ЕЩЁ).map(и => `<div class="c${и in ЕЩЁ ? ' new' : ''}"><svg class="hud-ico hi-${и}" viewBox="0 0 24 24"><use href="#hud-i-${и}"/></svg><b>${и}</b><i>${(эмодзи[и] || []).join(' ')}</i></div>`).join('');
};
const стиль = (s) => { document.documentElement.className = 'hud-icons-svg hud-ico-' + s; };
document.getElementById('st').onchange = (e) => стиль(e.target.value);
document.getElementById('only').onchange = рисовать;
const q = new URLSearchParams(location.search); стиль(q.get('s') || 'line'); document.getElementById('st').value = q.get('s') || 'line';
рисовать();
</script></body></html>
