<!doctype html><html><head><meta charset="utf-8"><style>
:root { --hud-nsfw-color: #d9548a; }
body { background: #0d0b12; color: #cfc6dc; font: 14px/1.4 system-ui; margin: 0; padding: 18px; }
﻿/* =========================================================================
   БЛИЗОСТЬ НА КАРТЕ ТЕЛА (render/scene-body.js): одежда по фигуре, темп,
   отметки проникновения и x-ray пенетрации в разрезе. Движение — только
   под курсором или после нажатия, потом замирает на месте.
   ========================================================================= */

/* --- Одежда: цвет из описания, ткань и состояние ------------------------- */
.hud-heat-svg .z-garment .body {
  fill: var(--cl, #8a8f9c); fill-opacity: .92;
  stroke: color-mix(in srgb, var(--cl, #8a8f9c) 55%, #9a9aa6); stroke-width: .55; stroke-linejoin: round;
  filter: drop-shadow(0 .5px .6px rgba(0,0,0,.45));
}
.hud-heat-svg .z-garment .seam, .hud-heat-svg .z-garment .fold {
  fill: none; stroke: color-mix(in srgb, var(--cl, #8a8f9c) 45%, #000); stroke-width: .55; stroke-linecap: round; opacity: .75;
}
.hud-heat-svg .z-garment .fold { stroke-width: .75; stroke: color-mix(in srgb, var(--cl, #8a8f9c) 60%, #000); }
/* На тёмной ткани швы светлее, чтобы читались. */
.hud-heat-svg .z-garment:is([style*="#1c1b21"], [style*="#1d1b22"], [style*="#1a1a1f"], [style*="#1a1716"], [style*="#241a18"], [style*="#2c2f38"], [style*="#2a2a30"], [style*="#26282f"]) :is(.seam, .fold) { stroke: color-mix(in srgb, var(--cl) 40%, #fff); opacity: .5; }
.hud-heat-svg .z-garment .strap { fill: none; stroke: var(--cl, #8a8f9c); stroke-width: 1; stroke-linecap: round; }
.hud-heat-svg .z-garment .band { fill: none; stroke: color-mix(in srgb, var(--cl, #8a8f9c) 60%, #fff); stroke-width: 1.4; opacity: .7; }
.hud-heat-svg .z-garment .btn { fill: color-mix(in srgb, var(--cl, #8a8f9c) 55%, #999); stroke: rgba(0,0,0,.35); stroke-width: .2; }
.hud-heat-svg .z-garment .btn.is-loose { opacity: .75; }
/* Ткани. */
.hud-heat-svg .z-garment.t-silk .body { fill-opacity: .86; stroke: color-mix(in srgb, var(--cl) 40%, #fff); stroke-width: .7; filter: drop-shadow(0 .5px .6px rgba(0,0,0,.4)) brightness(1.08); }
.hud-heat-svg .z-garment.t-lace .body { fill-opacity: .55; stroke-dasharray: 1 .7; stroke-width: .7; }
.hud-heat-svg .z-garment.t-sheer .body { fill-opacity: .38; }
.hud-heat-svg .z-garment.t-leather .body { fill-opacity: .96; stroke: color-mix(in srgb, var(--cl) 50%, #fff); filter: drop-shadow(0 .5px .6px rgba(0,0,0,.5)) contrast(1.15); }
.hud-heat-svg .z-garment.t-knit .body { stroke-dasharray: .9 .5; }
/* Мокрая ткань липнет и просвечивает; порванная — неровный край. */
.hud-heat-svg .z-garment.is-wet .body { fill-opacity: .6; filter: drop-shadow(0 .5px .6px rgba(0,0,0,.4)) saturate(.85) brightness(.9); }
.hud-heat-svg .z-garment.is-torn .body { stroke-dasharray: 2.4 .9; }
/* Голое тело: подсветка контура чуть теплее. */
.hud-heat.is-nude .hud-heat-svg .z-rim { filter: drop-shadow(0 0 2px color-mix(in srgb, var(--heat, #e0507a) 45%, transparent)); }

/* --- Проникновение: отметка на зоне + подпись ------------------------------ */
.hud-heat.hide-pen .z-pen-layer, .hud-heat.hide-pen .hud-pen-list, .hud-heat.hide-pen .hud-xray { display: none; }
.hud-heat-svg .z-pen { --pc: var(--hud-nsfw-color, #d9548a); }
.hud-heat-svg .z-pen.p-fingers { --pc: #f0a94a; }
.hud-heat-svg .z-pen.p-tongue { --pc: #ff7aa8; }
.hud-heat-svg .z-pen.p-toy { --pc: #9b7bff; }
.hud-heat-svg .z-pen-core { fill: var(--pc); stroke: #fff; stroke-width: .5; filter: drop-shadow(0 0 2px var(--pc)); }
.hud-heat-svg .z-pen-tag rect { fill: rgba(14, 10, 16, .82); stroke: var(--pc); stroke-width: .4; }
.hud-heat-svg .z-pen-tag text { fill: #fff; font-size: 5.4px; font-weight: 700; letter-spacing: .02em; }
.hud-pen-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.hud-pen { --pc: var(--hud-nsfw-color, #d9548a); display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 999px; font-size: .84em;
  background: color-mix(in srgb, var(--pc) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 45%, transparent); }
.hud-pen.p-fingers { --pc: #f0a94a; } .hud-pen.p-tongue { --pc: #ff7aa8; } .hud-pen.p-toy { --pc: #9b7bff; }
.hud-pen > i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 6px var(--pc); }
.hud-pen small { color: color-mix(in srgb, currentColor 70%, transparent); }

/* --- Темп: виды (render/scene-body.js → блокТемпа) ------------------------
   Один ритм на весь блок: --k — толчок (1 — до глубины, ~0 — назад), --sw —
   качание (−1…1, период — два толчка). Дети считают от них свой сдвиг. */
@property --k { syntax: '<number>'; inherits: true; initial-value: 1; }
@property --sw { syntax: '<number>'; inherits: true; initial-value: -1; }
.hud-tempo { --tc: var(--hud-nsfw-color, #d9548a); --k: 1; --sw: -1; display: flex; align-items: center; gap: 14px; margin-top: 8px; padding: 10px 14px 10px 12px; border-radius: 14px;
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--tc) 14%, transparent), transparent 60%), rgba(0,0,0,.18);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 30%, transparent); }
.hud-tempo.l0 { --tc: #8fa6c9; } .hud-tempo.l1 { --tc: color-mix(in srgb, var(--hud-nsfw-color, #d9548a) 50%, #c7a0ff); }
.hud-tempo.l4 { --tc: color-mix(in srgb, var(--hud-nsfw-color, #d9548a) 60%, #ff3b3b); }
.hud-tempo-visual { flex: none; display: grid; place-items: center; }
.hud-tempo-visual > svg { width: 104px; height: 104px; overflow: visible; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
.hud-tempo-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
.hud-tempo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.hud-tempo-head b { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--tc) 55%, #fff); }
.hud-tempo-head .bpm { font-size: .8em; color: color-mix(in srgb, currentColor 72%, transparent); }
.hud-tempo-head .bpm strong { font-size: 1.7em; font-weight: 800; color: color-mix(in srgb, var(--tc) 40%, #fff); margin-right: 4px; text-shadow: 0 0 10px color-mix(in srgb, var(--tc) 60%, transparent); }
.hud-tempo .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.hud-tempo .chips i { font-style: normal; font-size: .78em; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 22%, transparent); }
.hud-tempo-meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.hud-tempo-meter s { height: 5px; border-radius: 4px; background: color-mix(in srgb, currentColor 10%, transparent); text-decoration: none; }
.hud-tempo-meter s.on { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 50%, transparent), var(--tc)); box-shadow: 0 0 6px color-mix(in srgb, var(--tc) 50%, transparent); }
.hud-tempo-scale { display: flex; justify-content: space-between; font-size: .62em; letter-spacing: .06em; color: color-mix(in srgb, currentColor 55%, transparent); margin-top: -3px; }
@media (max-width: 420px) { .hud-tempo-visual > svg { width: 84px; height: 84px; } }

/* Шкала. */
.hud-tempo-tube { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.hud-tempo-tube .glass { position: relative; width: 26px; height: 92px; border-radius: 13px; overflow: hidden;
  background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1) 40%, rgba(255,255,255,.03)), rgba(0,0,0,.35);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tc) 45%, transparent), inset 0 -6px 10px rgba(0,0,0,.4); }
.hud-tempo-tube .glass > s { position: absolute; left: 0; width: 7px; height: 1.5px; background: color-mix(in srgb, currentColor 30%, transparent); z-index: 2; }
.hud-tempo-tube .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; transform-origin: 50% 100%; transform: scaleY(calc(var(--depth, .72) * var(--k)));
  background: linear-gradient(0deg, color-mix(in srgb, var(--tc) 85%, #000), var(--tc) 55%, color-mix(in srgb, var(--tc) 55%, #fff)); box-shadow: 0 0 14px var(--tc); }
.hud-tempo-tube .peak { position: absolute; left: 3px; right: 3px; bottom: calc(var(--depth, .72) * 100%); height: 2px; border-radius: 2px; background: #fff; opacity: .75; box-shadow: 0 0 6px var(--tc); }
.hud-tempo-tube small { font-size: .58em; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, currentColor 55%, transparent); order: -1; }

/* Тело: фигура-манекен в позе сцены, крупно. */
.hud-tempo.is-body { flex-wrap: wrap; }
.hud-tempo.is-body .hud-tempo-visual { flex: 1 1 260px; }
.hud-tempo.is-body .hud-tempo-visual > svg { width: 100%; max-width: 340px; height: auto; aspect-ratio: 160 / 120; }
.tv-body { --skin: color-mix(in srgb, var(--tc) 14%, #e9c3b2); --skin-d: color-mix(in srgb, var(--tc) 22%, #b98472); }
.tv-body.is-m { --skin: color-mix(in srgb, var(--tc) 12%, #d6a68f); --skin-d: color-mix(in srgb, var(--tc) 20%, #9c6c58); }
.tv-body .r0 { stop-color: color-mix(in srgb, var(--tc) 28%, #e8dcd8); } .tv-body .r1 { stop-color: color-mix(in srgb, var(--tc) 16%, #b9a9a6); }
.tv-body .h0 { stop-color: var(--tc); stop-opacity: .55; } .tv-body .h1 { stop-color: var(--tc); stop-opacity: 0; }
.tv-body .shadow { fill: rgba(0,0,0,.3); }
.tv-body .wall { fill: color-mix(in srgb, var(--tc) 10%, #3a2e30); } .tv-body .wall-edge { stroke: rgba(255,255,255,.15); stroke-width: 1; }
.tv-body .limb, .tv-body .neck { fill: none; stroke: var(--skin); stroke-linecap: round; }
.tv-body .limb.far { stroke: var(--skin-d); }
.tv-body :is(.chest, .pelvis), .tv-body .skull, .tv-body .bust { fill: var(--skin); }
.tv-body .waist { fill: none; stroke: var(--skin); stroke-linecap: round; }
.tv-body .chest, .tv-body .pelvis { stroke: var(--skin-d); stroke-width: .5; stroke-opacity: .6; }

.tv-body .bust { stroke: var(--skin-d); stroke-width: .5; }
.tv-body .hair { fill: color-mix(in srgb, var(--tc) 25%, #2b1a18); }
.tv-body .glow { opacity: calc(.15 + (1 - var(--k)) * .85 * var(--depth, .72)); }
.tv-body .move { transform-box: view-box; transform: rotate(calc((1 - var(--k)) * var(--amp, -8deg) * var(--depth, .72))); }

/* Метроном: орех, латунь, кремовая шкала. */
.tv-metronome .w0 { stop-color: #3d2116; } .tv-metronome .w1 { stop-color: #6e3d26; } .tv-metronome .w2 { stop-color: #2b160e; }
.tv-metronome .p0 { stop-color: #f2e7cf; } .tv-metronome .p1 { stop-color: #d8c6a2; }
.tv-metronome .m0 { stop-color: #8c6a2a; } .tv-metronome .m1 { stop-color: #f3d98b; } .tv-metronome .m2 { stop-color: #7a5a1e; }
.tv-metronome .shadow { fill: rgba(0,0,0,.4); }
.tv-metronome .bevel { fill: none; stroke: rgba(255,255,255,.18); stroke-width: .8; }
.tv-metronome .ticks path { stroke: #6a4a2a; stroke-width: .8; }
.tv-metronome .tip { fill: #f3d98b; }
.tv-metronome .key { stroke: #5a3e14; stroke-width: .5; }
.tv-metronome .pendulum { transform-box: view-box; transform-origin: 60px 100px; transform: rotate(calc(var(--sw) * 24deg * (.6 + var(--depth, .72) * .45))); }

/* Пружины матраса. */
.tv-springs .f0 { stop-color: color-mix(in srgb, var(--tc) 18%, #f4ece6); } .tv-springs .f1 { stop-color: color-mix(in srgb, var(--tc) 28%, #c9b8b0); }
.tv-springs .b0 { stop-color: #5b4636; } .tv-springs .b1 { stop-color: #2e2219; }
.tv-springs .coil { fill: none; stroke: #c9ced6; stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 1px 0 rgba(0,0,0,.4)); }
.tv-springs .coil.back { stroke: #8a909a; stroke-width: 1.4; opacity: .7; }
.tv-springs .tuft { fill: color-mix(in srgb, var(--tc) 40%, #7a6058); }
.tv-springs .stitch { fill: none; stroke: color-mix(in srgb, var(--tc) 25%, #9a8880); stroke-width: .6; stroke-dasharray: 1.4 1.2; }
.tv-springs .shadow { fill: rgba(0,0,0,.35); }
.tv-springs .coils { transform-box: view-box; transform-origin: 60px 92px; transform: scaleY(calc(1 - (1 - var(--k)) * var(--depth, .72) * .5)); }
.tv-springs .top { transform: translateY(calc((1 - var(--k)) * var(--depth, .72) * 23px)); }

/* Маятник Ньютона: хром. */
.tv-cradle .c0 { stop-color: #ffffff; } .tv-cradle .c1 { stop-color: #b8bec8; } .tv-cradle .c2 { stop-color: #3c4048; }
.tv-cradle .r0 { stop-color: #2e2a30; } .tv-cradle .r1 { stop-color: #141216; }
.tv-cradle .rail { fill: none; stroke: #c3c8d0; stroke-width: 2.2; stroke-linejoin: round; }
.tv-cradle .rail.inner { stroke-width: .8; stroke: rgba(255,255,255,.4); }
.tv-cradle .thread { fill: none; stroke: rgba(220, 225, 235, .55); stroke-width: .5; }
.tv-cradle .glint { fill: #fff; opacity: .85; }
.tv-cradle .shadow { fill: rgba(0,0,0,.4); }
.tv-cradle .ball { transform-box: view-box; }
.tv-cradle .b-left { transform-origin: 25.6px 18px; transform: rotate(calc(max(0, -1 * var(--sw)) * 34deg * var(--depth, .72))); }
.tv-cradle .b-right { transform-origin: 94.4px 18px; transform: rotate(calc(min(0, -1 * var(--sw)) * 34deg * var(--depth, .72))); }

/* Отметка проникновения на карте: точка и подпись, без движения. */
.hud-heat-svg .z-pen-halo { fill: color-mix(in srgb, var(--pc) 22%, transparent); stroke: var(--pc); stroke-width: .6; stroke-dasharray: 1.6 1.2; }

/* --- Движение: ритм на корне, на паузе; идёт под курсором/по нажатию ------- */
@media (prefers-reduced-motion: no-preference) {
  .hud-tempo { animation: hud-tk var(--beat, 1s) cubic-bezier(.5, 0, .3, 1) infinite, hud-tsw calc(var(--beat1, 1s) * 2) infinite; }
  .hud-tempo.is-ragged { animation-name: hud-tk-ragged, hud-tsw-ragged; animation-duration: var(--beat, 3s), var(--beat, 3s); }
}
.hud-tempo { animation-play-state: paused, paused; }
.hud-tempo:is(:hover, .fx-tap, .fx-on) { animation-play-state: running, running; }
.hud-tempo.l0 { animation: none; }
@keyframes hud-tk { 0% { --k: 1; } 45% { --k: .12; } 100% { --k: 1; } }
@keyframes hud-tsw {
  0% { --sw: -1; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
  50% { --sw: 1; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
  100% { --sw: -1; }
}
/* Рвано: три толчка разной силы через неровные промежутки. */
@keyframes hud-tk-ragged {
  0% { --k: 1; } 14% { --k: .15; } 28% { --k: .75; } 40% { --k: .3; } 48% { --k: .6; } 72% { --k: .08; } 100% { --k: 1; }
}
@keyframes hud-tsw-ragged {
  0% { --sw: -1; } 14% { --sw: .9; } 28% { --sw: -.5; } 40% { --sw: .4; } 48% { --sw: -.3; } 72% { --sw: 1; } 100% { --sw: -1; }
}

/* Светлые темы. */
:is(.hud-theme-kawaii, .hud-theme-medieval, .hud-theme-web1, .hud-theme-cottage, .hud-theme-solarpunk, .hud-theme-japan, .hud-theme-egypt, .hud-theme-western, .hud-theme-pirate) .hud-tempo { background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--tc) 14%, transparent), transparent 60%), rgba(255,255,255,.5); }
:is(.hud-theme-kawaii, .hud-theme-medieval, .hud-theme-web1, .hud-theme-cottage, .hud-theme-solarpunk, .hud-theme-japan, .hud-theme-egypt, .hud-theme-western, .hud-theme-pirate) .hud-tempo-head b { color: color-mix(in srgb, var(--tc) 70%, #000); }

/* Тёмная ткань на тёмном силуэте — светлый контур, чтобы вещь читалась. */
.hud-heat-svg .z-garment:is([style*="#1c1b21"], [style*="#1d1b22"], [style*="#1a1a1f"], [style*="#1a1716"], [style*="#241a18"], [style*="#2c2f38"], [style*="#2a2a30"], [style*="#26282f"], [style*="#1b2550"], [style*="#3f424a"]) .body { stroke: color-mix(in srgb, var(--cl) 25%, #d4d4de); stroke-width: .75; stroke-opacity: .8; }


/* Пульс отметки проникновения на карте — в такт темпу сцены. */
.hud-heat-svg .z-pen-core { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .hud-heat-svg .z-pen-core { animation: hud-pen-pulse var(--pp, 1.4s) ease-in-out infinite; animation-play-state: paused; }
  .hud-heat:is(:hover, .fx-tap, .fx-on) .z-pen-core { animation-play-state: running; }
}
@keyframes hud-pen-pulse { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.6); opacity: .8; } }

﻿/* =========================================================================
   РАЗРЕЗ ПЕНЕТРАЦИИ (render/xray.js)
   Стиль артов: тело в тёплых тонах кожи, круглая вырезка с розово-красной
   плотью, органы мягкими пятнами, инструмент внутри канала, влажный блеск.
   Движение: --k — толчок (1 — до глубины, ~0 — назад), --depth — глубина,
   --o — длина хода. Всё, что движется, считает сдвиг от них.
   ========================================================================= */

.hud-xray { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
.hud-xray-row {
  --pc: var(--hud-nsfw-color, #d9548a);
  display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;
  padding: 10px 12px 12px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(24,15,19,.86), rgba(12,8,10,.9));
  box-shadow: inset 0 0 0 1px rgba(226,175,160,.14), 0 8px 20px rgba(0,0,0,.4);
}
.hud-xray-row.p-fingers { --pc: #f0a94a; }
.hud-xray-row.p-tongue { --pc: #ff7aa8; }
.hud-xray-row.p-toy { --pc: #9b7bff; }
.hud-xray-row.p-fist { --pc: #ff6b5e; }
.hud-xray-visual { flex: none; line-height: 0; }

/* --- Полотно ------------------------------------------------------------ */
.xr-film {
  display: block; width: 300px; max-width: 100%; height: auto; border-radius: 12px;
  box-shadow: 0 0 0 1px rgba(226,175,160,.16), 0 10px 26px rgba(0,0,0,.55);
  background: #150e12;
}
.xr-plate { fill: #150e12; }
.xr-bg0 { stop-color: #2a1a22; } .xr-bg1 { stop-color: #1a1116; } .xr-bg2 { stop-color: #0c0809; }
.xr-vig0 { stop-color: #000; stop-opacity: 0; } .xr-vig1 { stop-color: #000; stop-opacity: .5; }
.xr-mark { fill: rgba(240,206,196,.34); font: 600 5.4px/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; }

/* --- Тело: тёплая кожа, тень на ягодице, румянец ------------------------ */
.xr-sk0 { stop-color: #fbe0c6; } .xr-sk1 { stop-color: #efb894; } .xr-sk2 { stop-color: #d99a76; }
/* Объём ягодиц: свет сверху-сбоку, тень к низу и наружу. */
.xr-butt0 { stop-color: rgba(255,244,232,.75); } .xr-butt1 { stop-color: rgba(238,182,150,.22); } .xr-butt2 { stop-color: rgba(126,68,46,.55); }
.xr-butt { stroke: rgba(180,120,94,.28); stroke-width: .7; }
.xr-butt-shine { fill: #fff; opacity: .16; filter: blur(7px); }
.xr-cleft { fill: none; stroke: #96543c; stroke-opacity: .6; stroke-width: 7; stroke-linecap: round; filter: blur(3px); }
