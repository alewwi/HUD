<!doctype html><html><head><meta charset="utf-8"><style>
:root { --hud-nsfw-color: #d9548a; }
body { background: #0d0b12; color: #cfc6dc; font: 14px/1.4 system-ui; margin: 0; padding: 18px; }
﻿/* =========================================================================
   БЛИЗОСТЬ НА КАРТЕ ТЕЛА (render/scene-body.js): одежда по фигуре, темп,
   отметки проникновения и x-ray пенетрации в разрезе. Движение — только
   под курсором или после нажатия, потом замирает на месте.
   ========================================================================= */

/* --- Одежда: цвет из описания, ткань и состояние ------------------------- */
.hud-heat-svg .z-garment .body {
  fill: var(--cl, #8a8f9c); fill-opacity: .92;
  stroke: color-mix(in srgb, var(--cl, #8a8f9c) 55%, #9a9aa6); stroke-width: .55; stroke-linejoin: round;
  filter: drop-shadow(0 .5px .6px rgba(0,0,0,.45));
}
.hud-heat-svg .z-garment .seam, .hud-heat-svg .z-garment .fold {
  fill: none; stroke: color-mix(in srgb, var(--cl, #8a8f9c) 45%, #000); stroke-width: .55; stroke-linecap: round; opacity: .75;
}
.hud-heat-svg .z-garment .fold { stroke-width: .75; stroke: color-mix(in srgb, var(--cl, #8a8f9c) 60%, #000); }
/* На тёмной ткани швы светлее, чтобы читались. */
.hud-heat-svg .z-garment:is([style*="#1c1b21"], [style*="#1d1b22"], [style*="#1a1a1f"], [style*="#1a1716"], [style*="#241a18"], [style*="#2c2f38"], [style*="#2a2a30"], [style*="#26282f"]) :is(.seam, .fold) { stroke: color-mix(in srgb, var(--cl) 40%, #fff); opacity: .5; }
.hud-heat-svg .z-garment .strap { fill: none; stroke: var(--cl, #8a8f9c); stroke-width: 1; stroke-linecap: round; }
.hud-heat-svg .z-garment .band { fill: none; stroke: color-mix(in srgb, var(--cl, #8a8f9c) 60%, #fff); stroke-width: 1.4; opacity: .7; }
.hud-heat-svg .z-garment .btn { fill: color-mix(in srgb, var(--cl, #8a8f9c) 55%, #999); stroke: rgba(0,0,0,.35); stroke-width: .2; }
.hud-heat-svg .z-garment .btn.is-loose { opacity: .75; }
/* Ткани. */
.hud-heat-svg .z-garment.t-silk .body { fill-opacity: .86; stroke: color-mix(in srgb, var(--cl) 40%, #fff); stroke-width: .7; filter: drop-shadow(0 .5px .6px rgba(0,0,0,.4)) brightness(1.08); }
.hud-heat-svg .z-garment.t-lace .body { fill-opacity: .55; stroke-dasharray: 1 .7; stroke-width: .7; }
.hud-heat-svg .z-garment.t-sheer .body { fill-opacity: .38; }
.hud-heat-svg .z-garment.t-leather .body { fill-opacity: .96; stroke: color-mix(in srgb, var(--cl) 50%, #fff); filter: drop-shadow(0 .5px .6px rgba(0,0,0,.5)) contrast(1.15); }
.hud-heat-svg .z-garment.t-knit .body { stroke-dasharray: .9 .5; }
/* Мокрая ткань липнет и просвечивает; порванная — неровный край. */
.hud-heat-svg .z-garment.is-wet .body { fill-opacity: .6; filter: drop-shadow(0 .5px .6px rgba(0,0,0,.4)) saturate(.85) brightness(.9); }
.hud-heat-svg .z-garment.is-torn .body { stroke-dasharray: 2.4 .9; }
/* Голое тело: подсветка контура чуть теплее. */
.hud-heat.is-nude .hud-heat-svg .z-rim { filter: drop-shadow(0 0 2px color-mix(in srgb, var(--heat, #e0507a) 45%, transparent)); }

/* --- Проникновение: отметка на зоне + подпись ------------------------------ */
.hud-heat.hide-pen .z-pen-layer, .hud-heat.hide-pen .hud-pen-list, .hud-heat.hide-pen .hud-xray { display: none; }
.hud-heat-svg .z-pen { --pc: var(--hud-nsfw-color, #d9548a); }
.hud-heat-svg .z-pen.p-fingers { --pc: #f0a94a; }
.hud-heat-svg .z-pen.p-tongue { --pc: #ff7aa8; }
.hud-heat-svg .z-pen.p-toy { --pc: #9b7bff; }
.hud-heat-svg .z-pen-core { fill: var(--pc); stroke: #fff; stroke-width: .5; filter: drop-shadow(0 0 2px var(--pc)); }
.hud-heat-svg .z-pen-tag rect { fill: rgba(14, 10, 16, .82); stroke: var(--pc); stroke-width: .4; }
.hud-heat-svg .z-pen-tag text { fill: #fff; font-size: 5.4px; font-weight: 700; letter-spacing: .02em; }
.hud-pen-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.hud-pen { --pc: var(--hud-nsfw-color, #d9548a); display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 7px; border-radius: 999px; font-size: .84em;
  background: color-mix(in srgb, var(--pc) 16%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--pc) 45%, transparent); }
.hud-pen.p-fingers { --pc: #f0a94a; } .hud-pen.p-tongue { --pc: #ff7aa8; } .hud-pen.p-toy { --pc: #9b7bff; }
.hud-pen > i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 6px var(--pc); }
.hud-pen small { color: color-mix(in srgb, currentColor 70%, transparent); }

/* --- Темп: виды (render/scene-body.js → блокТемпа) ------------------------
   Один ритм на весь блок: --k — толчок (1 — до глубины, ~0 — назад), --sw —
   качание (−1…1, период — два толчка). Дети считают от них свой сдвиг. */
@property --k { syntax: '<number>'; inherits: true; initial-value: 1; }
@property --sw { syntax: '<number>'; inherits: true; initial-value: -1; }
/* --v — куда движется: −1 выход, +1 вход, 0 — стоит на глубине. */
@property --v { syntax: '<number>'; inherits: true; initial-value: 0; }
.hud-tempo { --tc: var(--hud-nsfw-color, #d9548a); --k: 1; --sw: -1; display: flex; align-items: center; gap: 14px; margin-top: 8px; padding: 10px 14px 10px 12px; border-radius: 14px;
  background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--tc) 14%, transparent), transparent 60%), rgba(0,0,0,.18);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tc) 30%, transparent); }
.hud-tempo.l0 { --tc: #8fa6c9; } .hud-tempo.l1 { --tc: color-mix(in srgb, var(--hud-nsfw-color, #d9548a) 50%, #c7a0ff); }
.hud-tempo.l4 { --tc: color-mix(in srgb, var(--hud-nsfw-color, #d9548a) 60%, #ff3b3b); }
.hud-tempo-visual { flex: none; display: grid; place-items: center; }
.hud-tempo-visual > svg { width: 104px; height: 104px; overflow: visible; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); }
.hud-tempo-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
.hud-tempo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.hud-tempo-head b { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--tc) 55%, #fff); }
.hud-tempo-head .bpm { font-size: .8em; color: color-mix(in srgb, currentColor 72%, transparent); }
.hud-tempo-head .bpm strong { font-size: 1.7em; font-weight: 800; color: color-mix(in srgb, var(--tc) 40%, #fff); margin-right: 4px; text-shadow: 0 0 10px color-mix(in srgb, var(--tc) 60%, transparent); }
.hud-tempo .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.hud-tempo .chips i { font-style: normal; font-size: .78em; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--tc) 22%, transparent); }
.hud-tempo-meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.hud-tempo-meter s { height: 5px; border-radius: 4px; background: color-mix(in srgb, currentColor 10%, transparent); text-decoration: none; }
.hud-tempo-meter s.on { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 50%, transparent), var(--tc)); box-shadow: 0 0 6px color-mix(in srgb, var(--tc) 50%, transparent); }
.hud-tempo-scale { display: flex; justify-content: space-between; font-size: .62em; letter-spacing: .06em; color: color-mix(in srgb, currentColor 55%, transparent); margin-top: -3px; }
@media (max-width: 420px) { .hud-tempo-visual > svg { width: 84px; height: 84px; } }

/* Шкала. */
.hud-tempo-tube { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.hud-tempo-tube .glass { position: relative; width: 26px; height: 92px; border-radius: 13px; overflow: hidden;
  background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1) 40%, rgba(255,255,255,.03)), rgba(0,0,0,.35);
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--tc) 45%, transparent), inset 0 -6px 10px rgba(0,0,0,.4); }
.hud-tempo-tube .glass > s { position: absolute; left: 0; width: 7px; height: 1.5px; background: color-mix(in srgb, currentColor 30%, transparent); z-index: 2; }
.hud-tempo-tube .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; transform-origin: 50% 100%; transform: scaleY(calc(var(--depth, .72) * var(--k)));
  background: linear-gradient(0deg, color-mix(in srgb, var(--tc) 85%, #000), var(--tc) 55%, color-mix(in srgb, var(--tc) 55%, #fff)); box-shadow: 0 0 14px var(--tc); }
.hud-tempo-tube .peak { position: absolute; left: 3px; right: 3px; bottom: calc(var(--depth, .72) * 100%); height: 2px; border-radius: 2px; background: #fff; opacity: .75; box-shadow: 0 0 6px var(--tc); }
.hud-tempo-tube small { font-size: .58em; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, currentColor 55%, transparent); order: -1; }

/* Метроном: орех, латунь, кремовая шкала. */
.tv-metronome .w0 { stop-color: #3d2116; } .tv-metronome .w1 { stop-color: #6e3d26; } .tv-metronome .w2 { stop-color: #2b160e; }
.tv-metronome .p0 { stop-color: #f2e7cf; } .tv-metronome .p1 { stop-color: #d8c6a2; }
.tv-metronome .m0 { stop-color: #8c6a2a; } .tv-metronome .m1 { stop-color: #f3d98b; } .tv-metronome .m2 { stop-color: #7a5a1e; }
.tv-metronome .shadow { fill: rgba(0,0,0,.4); }
.tv-metronome .bevel { fill: none; stroke: rgba(255,255,255,.18); stroke-width: .8; }
.tv-metronome .ticks path { stroke: #6a4a2a; stroke-width: .8; }
.tv-metronome .tip { fill: #f3d98b; }
.tv-metronome .key { stroke: #5a3e14; stroke-width: .5; }
.tv-metronome .pendulum { transform-box: view-box; transform-origin: 60px 100px; transform: rotate(calc(var(--sw) * 24deg * (.6 + var(--depth, .72) * .45))); }

/* Пружины матраса. */
.tv-springs .f0 { stop-color: color-mix(in srgb, var(--tc) 18%, #f4ece6); } .tv-springs .f1 { stop-color: color-mix(in srgb, var(--tc) 28%, #c9b8b0); }
.tv-springs .b0 { stop-color: #5b4636; } .tv-springs .b1 { stop-color: #2e2219; }
.tv-springs .coil { fill: none; stroke: #c9ced6; stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 1px 0 rgba(0,0,0,.4)); }
.tv-springs .coil.back { stroke: #8a909a; stroke-width: 1.4; opacity: .7; }
.tv-springs .tuft { fill: color-mix(in srgb, var(--tc) 40%, #7a6058); }
.tv-springs .stitch { fill: none; stroke: color-mix(in srgb, var(--tc) 25%, #9a8880); stroke-width: .6; stroke-dasharray: 1.4 1.2; }
.tv-springs .shadow { fill: rgba(0,0,0,.35); }
.tv-springs .coils { transform-box: view-box; transform-origin: 60px 92px; transform: scaleY(calc(1 - (1 - var(--k)) * var(--depth, .72) * .5)); }
.tv-springs .top { transform: translateY(calc((1 - var(--k)) * var(--depth, .72) * 23px)); }

/* Маятник Ньютона: хром. */
.tv-cradle .c0 { stop-color: #ffffff; } .tv-cradle .c1 { stop-color: #b8bec8; } .tv-cradle .c2 { stop-color: #3c4048; }
.tv-cradle .r0 { stop-color: #2e2a30; } .tv-cradle .r1 { stop-color: #141216; }
.tv-cradle .rail { fill: none; stroke: #c3c8d0; stroke-width: 2.2; stroke-linejoin: round; }
.tv-cradle .rail.inner { stroke-width: .8; stroke: rgba(255,255,255,.4); }
.tv-cradle .thread { fill: none; stroke: rgba(220, 225, 235, .55); stroke-width: .5; }
.tv-cradle .glint { fill: #fff; opacity: .85; }
.tv-cradle .shadow { fill: rgba(0,0,0,.4); }
.tv-cradle .ball { transform-box: view-box; }
.tv-cradle .b-left { transform-origin: 25.6px 18px; transform: rotate(calc(max(0, -1 * var(--sw)) * 34deg * var(--depth, .72))); }
.tv-cradle .b-right { transform-origin: 94.4px 18px; transform: rotate(calc(min(0, -1 * var(--sw)) * 34deg * var(--depth, .72))); }

/* Отметка проникновения на карте: точка и подпись, без движения. */
.hud-heat-svg .z-pen-halo { fill: color-mix(in srgb, var(--pc) 22%, transparent); stroke: var(--pc); stroke-width: .6; stroke-dasharray: 1.6 1.2; }

/* --- Движение: ритм на корне, на паузе; идёт под курсором/по нажатию ------- */
@media (prefers-reduced-motion: no-preference) {
  .hud-tempo { animation: hud-tk var(--beat, 1s) cubic-bezier(.5, 0, .3, 1) infinite, hud-tsw calc(var(--beat1, 1s) * 2) infinite, hud-tv var(--beat, 1s) linear infinite; }
  .hud-tempo.is-ragged { animation-name: hud-tk-ragged, hud-tsw-ragged, hud-tv-ragged; animation-duration: var(--beat, 3s), var(--beat, 3s), var(--beat, 3s); }
}
.hud-tempo { animation-play-state: paused, paused; }
.hud-tempo:is(:hover, .fx-tap, .fx-on) { animation-play-state: running, running; }
.hud-tempo.l0 { animation: none; }
/* Выход — плавный, с замедлением в конце; вход — разгон до удара. Не зеркало. */
/* После удара — короткая задержка на глубине, выход трогается мягко с места
   и плавно замедляется к краю, вход разгоняется в удар. Без отскока. */
@keyframes hud-tk { 0% { --k: 1; animation-timing-function: cubic-bezier(.6, 0, .35, 1); } 64% { --k: .12; animation-timing-function: cubic-bezier(.5, 0, .85, .5); } 100% { --k: 1; } }
@keyframes hud-tv { 0% { --v: 0; } 10% { --v: -.4; } 22% { --v: -1; } 56% { --v: -1; } 64% { --v: 0; } 72% { --v: 1; } 97% { --v: 1; } 100% { --v: 0; } }
@keyframes hud-tv-ragged { 0% { --v: 0; } 3% { --v: -1; } 12% { --v: -1; } 16% { --v: 1; } 26% { --v: 1; } 30% { --v: -1; } 38% { --v: -1; } 42% { --v: 1; } 46% { --v: 1; } 50% { --v: -1; } 70% { --v: -1; } 74% { --v: 1; } 97% { --v: 1; } 100% { --v: 0; } }
@keyframes hud-tsw {
  0% { --sw: -1; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
  50% { --sw: 1; animation-timing-function: cubic-bezier(.45, 0, .55, 1); }
  100% { --sw: -1; }
}
/* Рвано: три толчка разной силы через неровные промежутки. */
@keyframes hud-tk-ragged {
  0% { --k: 1; } 14% { --k: .15; } 28% { --k: .75; } 40% { --k: .3; } 48% { --k: .6; } 72% { --k: .08; } 100% { --k: 1; }
}
@keyframes hud-tsw-ragged {
  0% { --sw: -1; } 14% { --sw: .9; } 28% { --sw: -.5; } 40% { --sw: .4; } 48% { --sw: -.3; } 72% { --sw: 1; } 100% { --sw: -1; }
}



/* Тёмная ткань на тёмном силуэте — светлый контур, чтобы вещь читалась. */
.hud-heat-svg .z-garment:is([style*="#1c1b21"], [style*="#1d1b22"], [style*="#1a1a1f"], [style*="#1a1716"], [style*="#241a18"], [style*="#2c2f38"], [style*="#2a2a30"], [style*="#26282f"], [style*="#1b2550"], [style*="#3f424a"]) .body { stroke: color-mix(in srgb, var(--cl) 25%, #d4d4de); stroke-width: .75; stroke-opacity: .8; }


/* Пульс отметки проникновения на карте — в такт темпу сцены. */
.hud-heat-svg .z-pen-core { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .hud-heat-svg .z-pen-core { animation: hud-pen-pulse var(--pp, 1.4s) ease-in-out infinite; animation-play-state: paused; }
  .hud-heat:is(:hover, .fx-tap, .fx-on) .z-pen-core { animation-play-state: running; }
}
@keyframes hud-pen-pulse { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.6); opacity: .8; } }

/* --- Узоры толчка (render/xray.js: УЗОРЫ — те же кадры, что у волны) -------
   дразнит — без проникновения: головкой по губам, кругами на клиторе,
   шлепки по нему, нажим на вход; кругами — в глубине, таз по кругу без хода;
   нарастает — толчки всё чаще к концу цикла; на всю длину — медленный ход
   до самой головки и обратно. */
@media (prefers-reduced-motion: no-preference) {
  .hud-tempo.is-tease { animation-name: hud-tk-tease, hud-tsw, hud-tv-tease; animation-duration: var(--beat, 4.8s), calc(var(--beat1, 1s) * 2), var(--beat, 4.8s); animation-timing-function: cubic-bezier(.37, 0, .63, 1), ease-in-out, linear; }
  .hud-tempo.is-grind { animation-name: hud-tk-grind, hud-tsw-grind, hud-tv-grind; animation-duration: var(--beat, 1.5s), var(--beat, 1.5s), var(--beat, 1.5s); }
  .hud-tempo.is-build { animation-name: hud-tk-build, hud-tsw, hud-tv-build; animation-duration: var(--beat, 4s), calc(var(--beat1, 1s) * 2), var(--beat, 4s); }
  .hud-tempo.is-long { animation-name: hud-tk-long, hud-tsw, hud-tv; animation-duration: var(--beat, 1.4s), calc(var(--beat1, 1s) * 2), var(--beat, 1.4s); }
}
/* Дразнит — внутрь не входит (render/xray.js: разрез → трение, строка
   is-rub is-tz). --ry — головка по губам (0 — вход, 1 — клитор), --tx —
   ближе-дальше от губ, px: −9 — отвёл для шлепка, +1,8 — давит на вход, но
   не проходит. Кадры --ry — те же, что у волны (УЗОРЫ.tease):
   медленно вверх, кругами на клиторе, два шлепка по нему, вниз ко входу,
   два нажима на вход — будто сейчас войдёт — и отступает. */
@property --tx { syntax: '<number>'; inherits: true; initial-value: 0; }
/* Плавно: все отрезки — по синусу (медленно трогается, медленно встаёт),
   разворотов мало — один неспешный круг, два мягких шлепка, один нажим. */
@keyframes hud-tk-tease {
  0% { --ry: .04; --tx: 0; --k: .9; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  20% { --ry: 1; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 30% { --ry: .9; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  40% { --ry: 1; --tx: 0; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  46% { --tx: -5; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 52% { --tx: 0; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  58% { --tx: -5; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 64% { --ry: 1; --tx: 0; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  78% { --ry: .04; --tx: 0; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  86% { --tx: 1.6; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 93% { --tx: 0; animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
  100% { --ry: .04; --tx: 0; --k: .9; }
}
@keyframes hud-tv-tease { 0%, 100% { --v: 0; } }
/* Кругами — настоящий круг без остановок: глубина (--k) — косинус, вверх-вниз
   (--sw) — синус, со сдвигом в четверть. Синус из отрезков «быстро от нуля —
   медленно к краю» (кадры в крайних точках и в нулях). Раньше на каждом
   кадре движение замирало — круг шёл рывками. */
@keyframes hud-tk-grind { 0% { --k: 1; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 50% { --k: .8; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 100% { --k: 1; } }
@keyframes hud-tsw-grind {
  0% { --sw: 0; animation-timing-function: cubic-bezier(.33, .66, .66, 1); } 25% { --sw: 1.3; animation-timing-function: cubic-bezier(.33, 0, .66, .33); }
  50% { --sw: 0; animation-timing-function: cubic-bezier(.33, .66, .66, 1); } 75% { --sw: -1.3; animation-timing-function: cubic-bezier(.33, 0, .66, .33); } 100% { --sw: 0; }
}
@keyframes hud-tv-grind { 0%, 50%, 100% { --v: 0; animation-timing-function: cubic-bezier(.33, .66, .66, 1); } 25% { --v: -.3; animation-timing-function: cubic-bezier(.33, 0, .66, .33); } 75% { --v: .3; animation-timing-function: cubic-bezier(.33, 0, .66, .33); } }
@keyframes hud-tk-build { 0% { --k: 1; } 20% { --k: .12; } 36% { --k: 1; } 50% { --k: .16; } 62% { --k: 1; } 71% { --k: .2; } 79% { --k: 1; } 86% { --k: .24; } 92% { --k: 1; } 96% { --k: .3; } 100% { --k: 1; } }
@keyframes hud-tv-build { 0% { --v: -1; } 19% { --v: -1; } 21% { --v: 1; } 35% { --v: 1; } 37% { --v: -1; } 49% { --v: -1; } 51% { --v: 1; } 61% { --v: 1; } 63% { --v: -1; } 70% { --v: -1; } 72% { --v: 1; } 78% { --v: 1; } 80% { --v: -1; } 85% { --v: -1; } 87% { --v: 1; } 91% { --v: 1; } 93% { --v: -1; } 95.5% { --v: -1; } 96.5% { --v: 1; } 100% { --v: 1; } }
@keyframes hud-tk-long { 0% { --k: 1; animation-timing-function: cubic-bezier(.6, 0, .35, 1); } 60% { --k: .02; animation-timing-function: cubic-bezier(.5, 0, .85, .5); } 100% { --k: 1; } }

/* Трётся у входа (узор rub): головка снаружи и ходит по губам вверх к клитору
   и обратно — --ry от 0 (вход) до 1 (клитор); у строки --rub — на сколько px
   вверх (render/xray.js: разрез → трение). Клитор вспыхивает наверху хода. */
@property --ry { syntax: '<number>'; inherits: true; initial-value: 0; }
@media (prefers-reduced-motion: no-preference) {
  .hud-tempo.is-rub { animation-name: hud-tk-rub, hud-tsw, hud-ry; animation-duration: var(--beat, 2.4s), calc(var(--beat1, 1.6s) * 2), var(--beat, 2.4s); animation-timing-function: cubic-bezier(.37, 0, .63, 1); }
}
@keyframes hud-tk-rub { 0% { --k: .84; --v: 0; } 50% { --k: 1; } 100% { --k: .84; --v: 0; } }
/* Вверх к клитору и вниз — ровно, по синусу, без разворотов посреди хода
   (те же кадры, что у волны: render/xray.js, УЗОРЫ.rub). */
@keyframes hud-ry {
  0% { --ry: .04; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 50% { --ry: 1; animation-timing-function: cubic-bezier(.37, 0, .63, 1); } 100% { --ry: .04; }
}
/* Подъём головки: треть — бёдра (тело и ствол вместе, translateY), остальное
   — поворот ствола вокруг корня (.xr-pivot, --rot° на самом верху). У входа
   головка чуть вдавливается в губы; у «дразнит» ещё и --tx (шлепки, нажим). */
.hud-xray-row.is-rub .xr-move { transform: none; }
/* Кончик — между губ, а не во входе: на 4 px назад, у входа вдавливается
   на 1,6 px. Дальше он заходил во вход, и через преддверие просвечивало
   отверстие уретры — та самая «чёрная штучка» у головки. */
.hud-xray-row.is-rub .xr-move:is(.p-penis, .p-toy, .is-body) { transform: translate(calc(-4px + (1 - var(--ry, 0)) * 1.6px + var(--tx, 0) * 1px), calc(var(--ry, 0) * var(--rub, 0) * .35px)); }
.hud-xray-row.is-rub :is(.xr-meatus, .xr-precum, .xr-ripple, .xr-hit, .xr-splash) { display: none; }
/* Губы обнимают кончик головки, пока она прижата: без тёмного просвета
   между круглой головкой и плоской губой. Едут вверх вместе с головкой;
   отвёл головку для шлепка — губы отпускают. */
.xr-hug { transform: translateY(calc(var(--ry, 0) * var(--rub, 0) * 1px)); opacity: calc(1 - clamp(0, var(--tx, 0) / -4, 1)); }
.xr-hug-pad { fill: #d18c7e; filter: blur(1.1px); }
.xr-hug-crease { fill: none; stroke: #a8565a; stroke-opacity: .32; stroke-width: 1.4; stroke-linecap: round; filter: blur(.8px); }
.xr-pivot { transform: none; }
.hud-xray-row.is-rub:not(.is-finish) .xr-pivot { transform: rotate(calc(var(--ry, 0) * var(--rot, 0) * -1deg)); }
.hud-xray-row.is-rub .xr-clit-g { transform-box: fill-box; transform-origin: center; }
/* Клитор набухает, когда головка на нём, и вздрагивает от шлепка. */
:is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .hud-xray-row.is-rub .xr-clit-g { transform: scale(calc(1 + clamp(0, (var(--ry, 0) - .7) * 3.3, 1) * .22 + clamp(0, var(--tx, 0) / .6, 1) * clamp(0, (var(--ry, 0) - .9) * 10, 1) * .12)); filter: brightness(calc(1 + clamp(0, (var(--ry, 0) - .7) * 3.3, 1) * .25)); }
/* Губы под головкой расходятся, на нажиме — ещё шире. */
.hud-xray-row.is-rub .xr-pull.is-minor { transform: scaleX(calc(1 + (1 - var(--k, 1)) * .1 + clamp(0, var(--ry, 0) * 5, 1) * .1 + clamp(0, var(--tx, 0) / 1.8, 1) * .1)); }
/* Волна трения — подъём головки (--ry), и бегущая точка — тоже по нему. */
.hud-tempo:is(.is-rub, .is-tease) .xr-wave-dot circle { transform: translateY(calc((1 - var(--ry, 0)) * var(--wy, 22px))); }
.hud-tempo:is(.is-rub, .is-tease) .xr-wave-halo { transform: translateY(calc((1 - var(--ry, 0)) * var(--wy, 22px))) scale(calc(.6 + var(--ry, 0) * .7)); }
/* След трения: влажная полоса по щели и вмятина под головкой — идёт за ней. */
.xr-slick { fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-opacity: calc(.06 + var(--wet, .3) * .14); filter: blur(.9px); }
.xr-press-g { transform: translateY(calc(var(--ry, 0) * var(--rub, 0) * 1px)); opacity: calc(clamp(0, var(--ry, 0) * 6, 1) * (1 - clamp(0, var(--tx, 0) / -4, 1))); }
.xr-press { fill: #7a2238; opacity: .42; filter: blur(1.4px); }
.xr-press-hi { fill: none; stroke: #ffe2ea; stroke-opacity: .4; stroke-width: .9; stroke-linecap: round; filter: blur(.5px); }
@keyframes xr-slick { 0%, 100% { stroke-opacity: calc(.06 + var(--wet, .3) * .14); } 50% { stroke-opacity: calc(.14 + var(--wet, .3) * .22); } }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-slick { animation: xr-slick calc(var(--beat1, 1.6s) * 2) ease-in-out infinite; }
}

/* =========================================================================
   X-RAY ТЕКУЩЕЙ СЦЕНЫ (render/xray.js)
   Шапка темпа, сагиттальный разрез в реальном масштабе (тот, кого берут, —
   справа, тот, кто проникает, — слева), линейка в см и волна толчков.
   Движение — от --k блока темпа (1 — на глубине, ~.1 — назад): --amp — ход
   в px, --kp — момент, когда кончик задевает простату, --push — насколько
   упор сдвигает шейку.
   ========================================================================= */

.hud-xray { --pc: var(--hud-nsfw-color, #d9548a); display: flex; flex-direction: column; gap: 8px; }

/* --- Шапка темпа --------------------------------------------------------- */
.hud-xray-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.hud-xray-head > b { font-size: .72em; letter-spacing: .14em; text-transform: uppercase; color: color-mix(in srgb, var(--tc, var(--pc)) 55%, #fff); }
.hud-xray-head .bpm { font-size: .8em; color: color-mix(in srgb, currentColor 72%, transparent); }
.hud-xray-head .bpm strong { font-size: 1.7em; font-weight: 800; margin-right: 4px; color: color-mix(in srgb, var(--tc, var(--pc)) 40%, #fff);
  text-shadow: 0 0 10px color-mix(in srgb, var(--tc, var(--pc)) 60%, transparent); }
.hud-xray-head .chips { display: flex; flex-wrap: wrap; gap: 4px; }
.hud-xray-head .chips i { font-style: normal; font-size: .76em; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: color-mix(in srgb, var(--tc, var(--pc)) 22%, transparent); }

/* --- Ряд: подпись и разрез ----------------------------------------------- */
.hud-xray-row { --pc: var(--hud-nsfw-color, #d9548a); display: flex; flex-direction: column; gap: 5px; }
.hud-xray-row.p-fingers { --pc: #f0a94a; }
.hud-xray-row.p-tongue { --pc: #ff7aa8; }
.hud-xray-row.p-toy { --pc: #9b7bff; }
.hud-xray-row.p-fist { --pc: #ff6b5e; }
.hud-xray-cap { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: .84em; }
.hud-xray-cap > i { width: 8px; height: 8px; border-radius: 50%; background: var(--pc); box-shadow: 0 0 7px var(--pc); }
.hud-xray-cap b { font-weight: 800; }
.hud-xray-cap small { font-size: .86em; font-weight: 700; padding: 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--pc) 20%, transparent); }
.hud-xray-cap span { color: color-mix(in srgb, currentColor 75%, transparent); }
.hud-xray-cap em { margin-left: auto; font-style: normal; font-weight: 700; font-size: .92em; color: color-mix(in srgb, var(--pc) 45%, #fff); }
.hud-xray-visual { line-height: 0; }

/* --- Полотно ------------------------------------------------------------- */
.xr-film { display: block; width: 100%; max-width: 480px; height: auto; border-radius: 10px; background: #100a0e;
  box-shadow: 0 0 0 1px rgba(226,175,160,.14), 0 8px 20px rgba(0,0,0,.45); }
.xr-plate { fill: #100a0e; }

/* Тот, кого берут: разрез — приглушённая плоть, по краю — кожа и жир. */
.xr-b0 { stop-color: #b86a76; } .xr-b1 { stop-color: #94485a; } .xr-b2 { stop-color: #6a2c3e; }
.xr-fat { fill: none; stroke: #f3d49a; stroke-opacity: .32; stroke-width: 9; }
.xr-skin { fill: none; stroke: #f6d2b8; stroke-width: 2.4; stroke-linejoin: round; }
.xr-crease-skin { fill: none; stroke: #a8604c; stroke-opacity: .45; stroke-width: 1.4; stroke-linecap: round; filter: blur(.6px); }

/* Ориентиры внутри: кости, пузырь, матка, кишка, протоки. */
.xr-bone { fill: #efe1c4; stroke: #c4ad86; stroke-width: .7; }
.xr-uterus { fill: #d9788f; stroke: #f4b6c5; stroke-opacity: .65; stroke-width: .9; }
.xr-prostate-body { fill: #e29aaa; stroke: #ffd2dc; stroke-opacity: .4; stroke-width: .9; }
/* Светится, пока кончик за простатой, и вспыхивает на каждом толчке. */
.xr-prostate-glow { fill: #ffe0ea; opacity: calc(clamp(0, (var(--k, 1) - var(--kp, 2)) * 5, 1) * (.25 + .7 * clamp(0, (var(--k, 1) - .7) * 3.3, 1))); filter: blur(4px); }
.xr-palate { fill: #d47a90; stroke: #f6b8c8; stroke-opacity: .25; stroke-width: .7; filter: blur(.4px); }
.xr-uvula { fill: #e47a92; stroke: #ffc4d2; stroke-width: .7; }
.xr-tongue-mass { fill: #c24c64; stroke: none; }
.xr-papillae-line { fill: none; stroke: #f09aae; stroke-opacity: .55; stroke-width: 1; stroke-dasharray: .6 2; stroke-linecap: round; }

/* Канал: стенка слизистой, сомкнутая щель, складки. */
.xr-wall { fill: #c86f85; stroke: none; filter: blur(.8px); }
.xr-slit { fill: none; stroke: #5a1229; stroke-width: 2.2; stroke-linecap: round; }
.xr-ruga { fill: none; stroke: #f6bccb; stroke-opacity: .55; stroke-width: .8; stroke-linecap: round; }
/* Раскрытый канал вокруг того, что внутри: растянутая стенка и просвет. */
.xr-stretch { fill: #cf7489; stroke: none; filter: blur(1px); }
.xr-open { fill: #4a1324; filter: blur(.6px); }

/* То, во что упираются. */
.xr-cervix { fill: #d47891; stroke: #e9a2b3; stroke-opacity: .3; stroke-width: .8; filter: drop-shadow(-1px 0 3px rgba(90,20,40,.5)); }
.xr-cervix-hi { fill: #fff; opacity: .16; filter: blur(2px); }
.xr-os { fill: none; stroke: #8e2341; stroke-width: 1.4; stroke-linecap: round; }
.xr-end { transform: translateX(calc(clamp(0, (var(--k, 1) - .9) * 10, 1) * var(--push, 0) * 1px)); }

/* Вход и лицо снаружи. */
.xr-minora { fill: #c96880; stroke: none; filter: blur(.35px); }
.xr-minora-wet { fill: none; stroke: #fff; stroke-opacity: .14; stroke-width: 2.2; stroke-linecap: round; filter: blur(1.2px); }
.xr-clit { stroke: none; filter: blur(.2px); }
.xr-cl0 { stop-color: #ffd0da; } .xr-cl1 { stop-color: #e2738c; } .xr-cl2 { stop-color: #b44a64; }
.xr-vestibule { stroke: none; }
.xr-vs0 { stop-color: #c25e77; } .xr-vs1 { stop-color: #b0566c; stop-opacity: 0; }

.xr-anus { fill: none; stroke: #8c4152; stroke-width: .8; stroke-linecap: round; }
.xr-sphincter { fill: #96384f; opacity: .6; filter: blur(1.2px); }
.xr-lip { fill: #cf5d70; stroke: #a8394e; stroke-opacity: .6; stroke-width: .6; }
.xr-gline { fill: none; stroke: #b9735a; stroke-opacity: .55; stroke-width: .8; stroke-linecap: round; }

/* --- Тот, кто проникает -------------------------------------------------- */
.xr-s0 { stop-color: #f4caac; } .xr-s1 { stop-color: #e5aa8a; } .xr-s2 { stop-color: #c98566; }
.xr-gskin { stroke: #a8654c; stroke-opacity: .35; stroke-width: .7; stroke-linejoin: round; }
.xr-testis { fill: #b06a55; opacity: .4; filter: blur(2px); }
.xr-hair { fill: none; stroke: #4a3026; stroke-opacity: .35; stroke-width: .6; stroke-linecap: round; }
.xr-hair-shade { fill: #6b4434; opacity: .14; filter: blur(4px); }
.xr-o0 { stop-color: #f6cdb2; } .xr-o1 { stop-color: #e9ae90; } .xr-o2 { stop-color: #b8735a; }
.xr-shaft { stroke: none; }
.xr-shaft-edge { fill: none; stroke: #9c5a45; stroke-opacity: .32; stroke-width: .8; filter: blur(.3px); }
.xr-shaft-shade { fill: #8c4a3a; opacity: .18; filter: blur(1.6px); }
.xr-glans { fill: #e48d9a; stroke: #b9606f; stroke-opacity: .5; stroke-width: .7; }
.xr-glans-hi { fill: #fff; opacity: .28; filter: blur(1.6px); }
.xr-corona { fill: none; stroke: #8c3e4a; stroke-opacity: .4; stroke-width: 1.8; filter: blur(.6px); }
.xr-frenulum, .xr-fold { fill: none; stroke: #a85a52; stroke-opacity: .5; stroke-width: .8; stroke-linecap: round; }
.xr-meatus { fill: none; stroke: #8c3a46; stroke-width: .8; stroke-linecap: round; }
.xr-vein { fill: none; stroke: #9a6c86; stroke-opacity: .38; stroke-width: 2.2; stroke-linecap: round; filter: blur(.5px); }
.xr-ridge-u { fill: none; stroke: #9c5a45; stroke-opacity: .16; stroke-width: 2; stroke-linecap: round; filter: blur(.8px); }
.xr-gloss { fill: none; stroke: #fff; stroke-opacity: .3; stroke-width: 1.8; stroke-linecap: round; filter: blur(.9px); }
.xr-gloss.is-soft { stroke-opacity: .22; stroke-width: 1.4; }
.xr-hand { stroke: #a0614a; stroke-opacity: .55; stroke-width: .6; stroke-linejoin: round; }
.xr-hand:not([fill]) { fill: #efbfa2; }
/* Дальние пальцы — в тени: тот же объём, только темнее. */
.xr-hand.is-back, .xr-finger.is-back .xr-hand { filter: brightness(.86) saturate(1.06); }
.xr-nail { fill: #fbe6d8; stroke: #c9947c; stroke-width: .45; }
.xr-crease { fill: none; stroke: #a8684f; stroke-opacity: .4; stroke-width: .9; stroke-linecap: round; filter: blur(.4px); }
.xr-toy, .xr-toy-ring { fill: #a77bd6; stroke: #6f42a0; stroke-width: .7; }
.xr-toy-ring { fill: none; stroke-opacity: .6; }
.xr-toy-gloss { fill: none; stroke: #fff; stroke-opacity: .38; stroke-width: 2.2; stroke-linecap: round; filter: blur(1px); }
.xr-tongue { fill: #d65f76; stroke: none; }
.xr-tongue-lit { fill: none; stroke: #ff9fb2; stroke-opacity: .32; stroke-linecap: round; filter: blur(2.4px); }
.xr-tongue-dim { fill: none; stroke: #8e2a42; stroke-opacity: .34; stroke-linecap: round; filter: blur(2.4px); }
.xr-tg0 { stop-color: #ea8295; } .xr-tg1 { stop-color: #d65f76; } .xr-tg2 { stop-color: #b3445c; }
.xr-tongue-under { fill: none; stroke: #8e2f46; stroke-opacity: .45; stroke-width: 1.2; stroke-linecap: round; filter: blur(.4px); }
.xr-tongue-tip-hi { fill: #fff; opacity: .3; filter: blur(.8px); }
.xr-tongue-groove { fill: none; stroke: #9c3550; stroke-opacity: .4; stroke-width: 1.4; stroke-linecap: round; filter: blur(.5px); }
.xr-papillae circle { fill: #f7aebd; opacity: .55; }

/* Вспышка на кончике в момент толчка; сильнее, если упёрлись. */
.xr-g0 { stop-color: #ffe4ec; stop-opacity: .5; } .xr-g1 { stop-color: #ffd0dc; stop-opacity: 0; }
.xr-hit { opacity: 0; }
:is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-hit { opacity: calc(clamp(0, (var(--k, 1) - .82) * 5.5, 1) * var(--hit, .5)); }

/* Ход: всё, что движется с кончиком, отходит назад на (1 − --k) × --amp. */
.xr-move { transform: translateX(calc((1 - var(--k, 1)) * var(--amp, 20) * -1px)); }

/* --- Линейка ------------------------------------------------------------- */
.xr-ruler-line { stroke: rgba(255,222,230,.4); stroke-width: .6; }
.xr-tick { stroke: rgba(255,222,230,.45); stroke-width: .5; }
.xr-tick.is-major { stroke: rgba(255,222,230,.8); stroke-width: .7; }
.xr-num { fill: rgba(255,226,232,.7); font: 600 6px/1 ui-monospace, Consolas, monospace; text-anchor: middle; }
.xr-target { stroke: #fff; stroke-opacity: .35; stroke-width: .6; stroke-dasharray: 2 2; }
.xr-target-label { fill: #fff; fill-opacity: .85; font: 700 6.4px/1 ui-monospace, Consolas, monospace; }
.xr-caret { fill: var(--pc); stroke: #fff; stroke-width: .5; filter: drop-shadow(0 0 2px var(--pc)); }
.xr-end-label { fill: rgba(255,236,240,.62); font: 600 6px/1 system-ui, sans-serif; letter-spacing: .08em; text-anchor: middle; text-transform: uppercase; }

/* --- Волна темпа --------------------------------------------------------- */
.xr-wave { display: block; width: 100%; max-width: 480px; height: auto; }
.xr-wave-base { stroke: rgba(255,222,230,.18); stroke-width: .6; }
.xr-wave-beat { stroke: rgba(255,222,230,.14); stroke-width: .6; stroke-dasharray: 1.6 1.6; }
.xr-wf0 { stop-color: var(--tc, var(--pc)); stop-opacity: .38; } .xr-wf1 { stop-color: var(--tc, var(--pc)); stop-opacity: 0; }
.xr-wave-line { fill: none; stroke: color-mix(in srgb, var(--tc, var(--pc)) 70%, #fff); stroke-width: 1.3; stroke-linejoin: round; stroke-linecap: round; }
.xr-wave-glow { fill: none; stroke: var(--tc, var(--pc)); stroke-width: 4; stroke-opacity: .35; filter: blur(2px); }
.xr-wave-grid { stroke: rgba(255,222,230,.07); stroke-width: .5; }
.xr-wave-peak { fill: #fff; stroke: var(--tc, var(--pc)); stroke-width: .8; opacity: .85; }
.xr-wave-halo { fill: var(--tc, var(--pc)); opacity: calc(.15 + var(--k, 1) * .35); transform-box: fill-box; transform-origin: center; transform: translateY(calc((1 - var(--k, 1)) * var(--wy, 22px))) scale(calc(.6 + var(--k, 1) * .7)); filter: blur(1.5px); }
.xr-wave-head { stroke: rgba(255,255,255,.3); stroke-width: .6; }
.xr-wave-dot circle { fill: #fff; stroke: var(--tc, var(--pc)); stroke-width: 1; transform: translateY(calc((1 - var(--k, 1)) * var(--wy, 22px))); }
.hud-xray.is-still .xr-wave-run { display: none; }

@keyframes xr-run { from { transform: translateX(0); } to { transform: translateX(228px); } }
@media (prefers-reduced-motion: no-preference) {
  .xr-wave-run { animation: xr-run calc(var(--beat, 1s) * var(--reps, 2)) linear infinite; animation-play-state: paused; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-wave-run { animation-play-state: running; }
  /* Без блока темпа (стенд, старые вызовы) — свой ровный ритм. */
  .hud-xray.is-standalone { animation: hud-tk var(--beat, 1.6s) cubic-bezier(.5, 0, .3, 1) infinite; }
  .hud-xray.is-standalone.is-ragged { animation-name: hud-tk-ragged; }
}
.hud-xray.is-standalone { animation-play-state: paused; }
.hud-xray.is-standalone:is(:hover, .fx-tap, .fx-on) { animation-play-state: running; }

/* В блоке темпа x-ray — вся картинка: без второй панели скорости. */
.hud-tempo.is-xray { display: block; padding: 10px 12px 8px; }




/* --- Детали: губы вульвы, крестец ---------------------------------------- */
.xr-majora { stroke: none; }
.xr-vu0 { stop-color: #d99a82; } .xr-vu1 { stop-color: #cf8a7a; } .xr-vu2 { stop-color: #bf6f76; }
.xr-majora-sh { fill: none; stroke: #a8565a; stroke-opacity: .2; stroke-width: 2; stroke-linecap: round; filter: blur(1px); }
.xr-majora-hi { fill: none; stroke: #ffe6d6; stroke-opacity: .32; stroke-width: 2; stroke-linecap: round; filter: blur(1px); }
.xr-minora-edge { fill: none; stroke: #a84a62; stroke-width: .9; stroke-linecap: round; }
.xr-sacrum { fill: none; stroke: #dcc2a4; stroke-opacity: .55; stroke-width: 13; stroke-linecap: round; filter: blur(1.4px); }
.xr-sacrum-core { fill: none; stroke: #c9a986; stroke-width: 6; stroke-linecap: round; opacity: .35; filter: blur(1.4px); }
.xr-sacrum-seam { fill: none; stroke: #a8866a; stroke-opacity: .35; stroke-width: 1.6; stroke-linecap: round; filter: blur(.8px); }

/* --- Стенка, которая обхватывает то, что внутри ------------------------- */
.xr-w0 { stop-color: #a9536a; stop-opacity: 0; }
.xr-w1 { stop-color: #ad586d; }
.xr-w2 { stop-color: #bd6479; }
.xr-w3 { stop-color: #c86f85; }
.xr-ruffle { fill: #d47a91; stroke: #f0a8ba; stroke-opacity: .25; stroke-width: .4; }
.xr-fold-deep { fill: #8c2c46; opacity: .3; filter: blur(1.2px); }
.xr-fold-deep.is-shut { opacity: .26; }
.xr-contact { fill: none; stroke: #6e1a30; stroke-width: 1.6; stroke-opacity: .45; filter: blur(.7px); }
.xr-contact.is-front { stroke-width: 2; stroke-opacity: .4; }
.xr-gleam { fill: none; stroke: #fff; stroke-opacity: .16; stroke-width: 1.2; stroke-linecap: round; filter: blur(.6px); }
.xr-shut { fill: none; stroke: #6a1a2e; stroke-width: 1.5; stroke-opacity: .75; stroke-linecap: round; filter: blur(.4px); }
.xr-wall.is-soft { fill: #b65f75; stroke: none; filter: blur(1.6px); }

/* --- Голова и лицо — тёмные силуэты: важен только контур ----------------- */
.xr-film.is-dark .xr-body { fill: #2a1d23; }
.xr-film.is-dark .xr-skin { stroke: #8a6672; stroke-width: 1.3; }
.xr-film.is-dark .xr-fat { display: none; }
.xr-film.is-dark .xr-lip { fill: #7e3c4c; stroke: #a35466; }
.xr-mouthwall { fill: #9c4a5e; }
.xr-giver.is-shadow .xr-gskin { fill: #2a1d23; stroke: #8a6672; stroke-width: 1.3; stroke-opacity: 1; }
.xr-mouth-shade { fill: #2a1d23; }
.xr-tongue-lipshade { fill: none; stroke: #5a1828; stroke-opacity: .5; stroke-width: 5; filter: blur(2px); }

/* --- Семя: кончили внутрь ------------------------------------------------- */
.hud-xray-row.is-finish { --k: 1; }
.hud-xray-cap small.is-cum { background: rgba(255,250,240,.16); color: #fff6ea; }
.xr-cum-pool { fill: #fbf7ef; fill-opacity: .93; stroke: #fff; stroke-opacity: .7; stroke-width: .5; transform-origin: 0% 50% !important;
  transform-box: fill-box; transform-origin: 100% 50%; filter: drop-shadow(0 0 2px rgba(255,255,255,.45)); }
.xr-cum-drop { fill: #fffdf8; opacity: 0; transform-box: fill-box; transform-origin: center; }
.xr-cum-drip { fill: #fbf7ef; fill-opacity: .92; transform-box: fill-box; transform-origin: 50% 0; }
@keyframes xr-fill { 0% { transform: scaleX(.04); opacity: .15; } 100% { transform: scaleX(1); opacity: 1; } }
@keyframes xr-spurt { 0% { transform: translate(0, 0) scale(.5); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(var(--dx, 10px), var(--dy, 0px)) scale(1.25); opacity: 0; } }
@keyframes xr-drip { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
@keyframes xr-throb { 0%, 100% { filter: brightness(1); } 45% { filter: brightness(1.16) saturate(1.1); } }
/* В покое — итог (лужа и капля у входа); под курсором — заново: головка
   пульсирует, капли бьют, лужа растёт от глубины к входу. */
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-pool { animation: xr-pump 3.3s linear both; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-drop { animation: xr-spurt 1.1s ease-out var(--dl, 0s) infinite; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-drip { animation: xr-drip 2.6s ease-in 2.4s both; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .is-finish .xr-glans { animation: xr-throb .55s ease-in-out infinite; }
}

/* --- Губа стенки поверх края, колено согнутого члена, потёк ---------------- */
.xr-joint { stroke: none; }
.is-finish .xr-hit { display: none; }
.xr-cum-streak { fill: none; stroke: #fbf7ef; stroke-opacity: .9; stroke-width: 2.1; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
@keyframes xr-streak { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-streak { animation: xr-streak 2.2s ease-in 2s both; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-leak .xr-cum-drip { animation: xr-drip 1.4s ease-in 4s both; }
}

/* Член в горле сгибается по толчку: 0° на отходе, --bend° на глубине. */
.xr-bend { transform: rotate(calc(var(--bend, 0) * clamp(0, (var(--k, 1) - var(--kb, 1)) * var(--kbs, 1), 1) * 1deg)); }
/* Семя заливает шейку: канал и белая плёнка поверх. */
.xr-cum-canal { fill: none; stroke: #fbf7ef; stroke-opacity: .95; stroke-width: 3.4; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 0; filter: drop-shadow(0 0 1.4px rgba(255,255,255,.6)); }
@keyframes xr-canal { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@keyframes xr-glaze { 0% { opacity: 0; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-canal { animation: xr-canal-fill 3.3s linear .3s both; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-film { animation: xr-film 3.6s ease-out .6s both; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-jet { animation: xr-jet .55s ease-out var(--dl, 0s) 6 both; }
}

/* --- Красота: светотень, свет по коже, пульс темпа ------------------------ */
.xr-gshade { fill: none; stroke: #8c4a36; stroke-opacity: .35; stroke-width: 14; filter: blur(5px); }
.xr-glight { fill: #fff3e8; opacity: .22; filter: blur(9px); }
/* Стык нижнего края ствола с мошонкой — мягкая складка, а не жёсткая линия. */
.xr-root-crease { fill: none; stroke: #8c4a36; stroke-opacity: .22; stroke-width: 3; stroke-linecap: round; filter: blur(1.4px); }
.xr-shaft-hi { fill: none; stroke: #fff; stroke-opacity: .28; stroke-width: 3.2; stroke-linecap: round; filter: blur(1.4px); }
.xr-skin-hi { fill: none; stroke: #fff2e6; stroke-opacity: .35; stroke-width: 1; filter: blur(.6px); }
.xr-film.is-dark .xr-skin-hi { stroke-opacity: .12; }
.xr-cervix-canal { fill: none; stroke: #9e3550; stroke-opacity: .4; stroke-width: 1.6; stroke-linecap: round; filter: blur(.5px); }
/* Семя в горле и на языке. */
.xr-cum-throat { fill: none; stroke: #fbf7ef; stroke-opacity: .92; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; filter: drop-shadow(0 0 2px rgba(255,255,255,.4)); }
.xr-cum-tongue { fill: none; stroke: #fbf7ef; stroke-opacity: .8; stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-throat { animation: xr-streak 2.6s ease-out .4s both; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-cum-tongue { animation: xr-streak 2.4s ease-out 2.2s both; }
}
/* Пульс в шапке — вспыхивает на каждом толчке. */
.hud-xray-head { align-items: center; }
.hud-xray-pulse { width: 9px; height: 9px; border-radius: 50%; align-self: center; background: var(--tc, var(--pc));
  box-shadow: 0 0 calc(4px + var(--k, 1) * 10px) var(--tc, var(--pc)); transform: scale(calc(.55 + var(--k, 1) * .6)); opacity: calc(.45 + var(--k, 1) * .55); }
.hud-xray.is-still .hud-xray-pulse { transform: none; opacity: .5; box-shadow: none; }

/* --- Живое: губы тянутся за членом, клитор и головка набухают на ударе,
   мошонка качается в такт. Всё от --k / --sw блока темпа. ---------------- */
/* Губы, край ануса и губы рта не сдвигаются — тянутся от прикреплённого края:
   на выходе вытягиваются наружу, на входе вдавливаются. */
.xr-pull { transform-box: fill-box; transform-origin: 100% 50%; }
.xr-pull.is-minor { transform: scaleX(calc(1 + (1 - var(--k, 1)) * .18 + clamp(0, -1 * var(--v, 0), 1) * (1 - var(--k, 1)) * .32 - clamp(0, var(--v, 0), 1) * .07)); }
.xr-pull.is-lip { transform: scaleX(calc(1 + (1 - var(--k, 1)) * .05 + clamp(0, -1 * var(--v, 0), 1) * (1 - var(--k, 1)) * .1 - clamp(0, var(--v, 0), 1) * .03)); }
.xr-lip-line { fill: none; stroke: #8a6672; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.xr-pull.is-major { transform: scaleX(calc(1 + (1 - var(--k, 1)) * .04 + clamp(0, -1 * var(--v, 0), 1) * (1 - var(--k, 1)) * .06)); }
.xr-clit-g { transform-box: fill-box; transform-origin: center; }
:is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-clit-g { transform: scale(calc(1 + clamp(0, (var(--k, 1) - .85) * 6.6, 1) * .14)); }
:is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-glans { filter: brightness(calc(1 + clamp(0, (var(--k, 1) - .85) * 6.6, 1) * .07)); }

/* --- Влага (lb:) — блеск, бусины, ниточки, капля, брызги. --wet 0…1. ------- */
.hud-xray-cap small.is-wet { background: rgba(180,220,255,.14); color: #e6f3ff; }
.xr-film.is-wet .xr-gleam { stroke-opacity: calc(.16 + var(--wet, 0) * .1); }
.xr-film.is-wet .xr-ruffle { filter: brightness(calc(1 + var(--wet, 0) * .1)); }
.xr-film.is-wet .xr-gloss { stroke-opacity: calc(.3 + var(--wet, 0) * .2); }
.xr-film.is-wet .xr-minora-wet { stroke-opacity: calc(.14 + var(--wet, 0) * .14); }
.xr-wet-coat { fill: none; stroke: #fff; stroke-opacity: calc(.06 + var(--wet, 0) * .22); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 22 7 36 10 14 6; filter: blur(1.3px); }
.xr-wet-coat.is-low { stroke-opacity: calc(.04 + var(--wet, 0) * .12); stroke-dasharray: 20 12 40 8 9 6; }
.xr-bead-hi { fill: #fff; opacity: .9; }
.xr-bead { fill: #fff; fill-opacity: calc(.18 + var(--wet, 0) * .3); stroke: #fff; stroke-opacity: .35; stroke-width: .3; }
/* Ниточки тянутся только на выходе и рвутся на входе. */
.xr-strand { fill: none; stroke: #fff; stroke-width: .9; stroke-linecap: round; opacity: calc((1 - var(--k, 1)) * var(--wet, 0) * .26 * clamp(0, -1 * var(--v, 0), 1)); filter: blur(.7px); }
/* Брызги — только пока идут толчки: в покое член стоит на глубине (--k = 1),
   и брызги висели бы в воздухе. */
.xr-splash { fill: #fff; opacity: 0;
  transform: translate(calc(clamp(0, (var(--k, 1) - .9) * 10, 1) * var(--sx, 0)), calc(clamp(0, (var(--k, 1) - .9) * 10, 1) * var(--sy, 0))); }
:is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-splash { opacity: calc(clamp(0, (var(--k, 1) - .9) * 10, 1) * .85 * clamp(0, var(--v, 0) + .6, 1)); }
.xr-wet-run { fill: none; stroke: #fff; stroke-opacity: calc(var(--wet, 0) * .26); stroke-width: 2.2; stroke-linecap: round; filter: blur(1px); }
.xr-wet-drop { fill: #fff; opacity: calc(.25 + var(--wet, 0) * .5); }
.xr-wet-drip { transform-box: fill-box; transform-origin: 50% 0; }
/* Лубрикант — прозрачнее, с холодным бликом. */
.xr-film.is-lube :is(.xr-bead, .xr-wet-drop) { fill: #e8f4ff; }
.xr-film.is-lube .xr-wet-coat, .xr-film.is-lube .xr-wet-run, .xr-film.is-lube .xr-strand { stroke: #e8f4ff; }
@keyframes xr-wet-fall { 0%, 55% { transform: translateY(0) scaleY(1); opacity: 1; } 85% { transform: translateY(9px) scaleY(1.25); opacity: .9; } 100% { transform: translateY(14px) scaleY(1.3); opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-wet-drop { animation: xr-wet-fall calc(var(--beat, 1s) * 3) ease-in infinite; transform-box: fill-box; }
}

/* Язык лижет: кончик ходит вверх-вниз в ритме темпа, поверх толчков. */
.xr-lick { transform: rotate(-4deg); }
@keyframes xr-lick { from { transform: rotate(-13deg); } to { transform: rotate(10deg); } }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-lick { animation: xr-lick calc(var(--beat1, 1s) * .5) ease-in-out infinite alternate; }
}

/* --- Рот: без тёмного просвета — стенки и язык прилегают к стволу. -------- */
.xr-film.is-dark .xr-open { fill: #8e4054; filter: blur(.8px); }
.xr-film.is-dark .xr-stretch { fill: #a8566a; }
.xr-tongue-mass.is-tip { stroke: none; }
.xr-lick.is-oral { transform: none; }
@keyframes xr-lick-oral { from { transform: rotate(4deg); } to { transform: rotate(-7deg); } }

/* --- Мошонка качается в такт и подпрыгивает на ударе; волна на ударе. ---- */
.xr-scrotum-sh { fill: none; stroke: #8c4a36; stroke-opacity: .3; stroke-width: 6; filter: blur(2.4px); }
.xr-rugae-skin { fill: none; stroke: #9c5a45; stroke-opacity: .12; stroke-width: .8; stroke-linecap: round; filter: blur(.4px); }
.xr-gskin.is-scrotum, .xr-gskin.is-under, .xr-gskin.is-fill { stroke: none; }
.xr-gskin-line { fill: none; stroke: #a8654c; stroke-opacity: .35; stroke-width: .7; stroke-linejoin: round; }
.xr-ripple { fill: none; stroke: #ffd6e0; stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; filter: blur(1.6px); }
@keyframes xr-ripple { 0% { transform: scale(.7); opacity: 0; } 8% { transform: scale(.8); opacity: .3; } 45% { transform: scale(1.7); opacity: 0; } 100% { transform: scale(1.7); opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-lick.is-oral { animation: xr-lick-oral calc(var(--beat1, 1s) * .5) ease-in-out infinite alternate; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-ripple { animation: xr-ripple var(--beat1, 1s) ease-out infinite; }
}

/* --- Ещё движение ---------------------------------------------------------- */
/* Влажный блик скользит по стволу и игрушке. */
.xr-sheen-run { fill: none; stroke: #fff; stroke-opacity: 0; stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 14 86; filter: blur(1.2px); }
@keyframes xr-sheen { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
/* Вены наливаются на ударе. */
/* Сфинктер сжимается, когда член выходит. */
.xr-sphincter { transform-box: fill-box; transform-origin: 0 50%; }
/* Шейка вздрагивает от удара. */
@keyframes xr-wobble { 0% { transform: scale(1); } 8% { transform: scale(1.035, .975); } 30% { transform: scale(.985, 1.015); } 60%, 100% { transform: scale(1); } }
.xr-cervix { transform-box: fill-box; transform-origin: 0 50%; }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-sheen-run { stroke-opacity: .32; animation: xr-sheen calc(var(--beat1, 1s) * 2) linear infinite; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-vein { stroke-opacity: calc(.34 + clamp(0, (var(--k, 1) - .55) * 2.4, 1) * .26); stroke-width: calc(2.2px + clamp(0, (var(--k, 1) - .55) * 2.4, 1) * .8px); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-sphincter { transform: scaleY(calc(1 + (1 - var(--k, 1)) * .25)) scaleX(calc(1 - (1 - var(--k, 1)) * .08)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-cervix { animation: xr-wobble var(--beat1, 1s) ease-out infinite; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-vestibule { filter: brightness(calc(1 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .12)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-film.is-dark .xr-wall { filter: blur(.8px) brightness(calc(1 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .1)); }
}

/* =========================================================================
   ЖИВОЕ ТЕЛО — по 10 движений и деталей на каждый вид близости.
   Всё — от --k (толчок) и --sw (качание) блока темпа, только пока идёт.
   ========================================================================= */
.xr-tendon { fill: none; stroke: #fff2e8; stroke-opacity: .18; stroke-width: 1.4; stroke-linecap: round; filter: blur(.6px); }
.xr-flex { fill: none; stroke: #fff2e8; stroke-opacity: .14; stroke-width: 3; stroke-linecap: round; filter: blur(1.4px); }
.xr-knuckle-hi { fill: none; stroke: #fff; stroke-opacity: 0; stroke-width: 1.4; stroke-linecap: round; filter: blur(.6px); }
.xr-led { fill: #ffe3f8; opacity: .5; filter: drop-shadow(0 0 2px #ff9ae0); }
.xr-vibe-ring { fill: none; stroke: #e8d4ff; stroke-width: 1.6; opacity: 0; transform-box: fill-box; transform-origin: center; filter: blur(1px); }
.xr-flange { transform-box: fill-box; transform-origin: 100% 50%; }

/* Большой палец трёт клитор — поворотом вокруг своего основания. */

@media (prefers-reduced-motion: no-preference) {

  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-glans { filter: brightness(calc(1 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .07)) saturate(calc(1 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .35)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-gshade { stroke-opacity: calc(.35 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .25); }
  /* Анал: перистальтика, своя мошонка у мужчины качается. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-peri { stroke-opacity: .22; animation: xr-sheen calc(var(--beat1, 1s) * 3) linear infinite reverse; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-own { transform: translateY(calc(var(--sw, -1) * 1.6px)); }
  /* Игрушка: вибрация, волны от кончика, мигает индикатор, упор пружинит. */

  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-vibe-ring { animation: xr-ripple .45s ease-out infinite; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-led { animation: xr-led .9s ease-in-out infinite; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-flange { transform: scaleX(calc(1 - clamp(0, (var(--k, 1) - .8) * 5, 1) * .12)); }
  /* Пальцы: манящее сгибание, большой палец трёт клитор, сухожилия, точка G. */
  /* Кисть чуть покачивается; сгибаются сами пальцы — в суставах (ниже). */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-curl { transform: rotate(calc(clamp(0, (var(--k, 1) - .4) * 1.67, 1) * -2.4deg + var(--sw, -1) * -.4deg)); }
:is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-thumb { animation: xr-rub calc(var(--beat1, 1s) * .5) ease-in-out infinite alternate; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-tendon { stroke-opacity: calc(.12 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .22); }

  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-twist { transform: rotate(calc(var(--sw, -1) * 3deg)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-knuckles { transform: translateY(calc(var(--sw, -1) * .9px)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-flex { stroke-opacity: calc(.08 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .26); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-bulge { opacity: calc(clamp(0, (var(--k, 1) - .8) * 5, 1) * .4); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-knuckle-hi { stroke-opacity: calc(clamp(0, (var(--k, 1) - .8) * 5, 1) * .5); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row.p-fist .xr-minora { filter: blur(.35px) brightness(calc(1 + var(--k, 1) * .14)); }
  /* Рот: язычок качается, глоток катится по горлу. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-uvula-sw { transform: rotate(calc(var(--sw, -1) * 9deg)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-drool { animation: xr-wet-fall calc(var(--beat1, 1s) * 4) ease-in infinite; }
  /* Куни: голова покачивается, язык перекатывается, клитор вздрагивает в такт. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-nod { transform: rotate(calc(var(--sw, -1) * 1.8deg)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-tongue-grp:not(.is-oral) { animation: xr-tongue-roll calc(var(--beat1, 1s) * .5) ease-in-out infinite alternate; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row.p-tongue .xr-clit-g { animation: xr-flick calc(var(--beat1, 1s) * .5) ease-in-out infinite alternate; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row.p-tongue .xr-minora-wet { stroke-opacity: .3; }

/* --- Семя: толчками из головки, струями в зев, канал шейки заполняется ---- */
.xr-cum-film { fill: #fbf7ef; fill-opacity: .4; transform-box: fill-box; transform-origin: center; }
.xr-cum-jet { fill: none; stroke: #fffdf8; stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 18 82; stroke-dashoffset: 100; opacity: 0; filter: blur(.25px); }
/* Лужа растёт толчками — в такт пульсации головки (.55 с). */
@keyframes xr-pump { 0% { transform: scaleX(.05); } 8% { transform: scaleX(.28); } 17% { transform: scaleX(.32); } 25% { transform: scaleX(.52); } 33% { transform: scaleX(.55); } 42% { transform: scaleX(.72); } 50% { transform: scaleX(.75); } 58% { transform: scaleX(.88); } 67% { transform: scaleX(.9); } 83% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
@keyframes xr-canal-fill { 0% { stroke-dashoffset: 100; } 15% { stroke-dashoffset: 82; } 33% { stroke-dashoffset: 60; } 50% { stroke-dashoffset: 40; } 67% { stroke-dashoffset: 20; } 85%, 100% { stroke-dashoffset: 0; } }
@keyframes xr-film { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes xr-jet { 0% { stroke-dashoffset: 100; opacity: 0; } 15% { opacity: .95; } 100% { stroke-dashoffset: 0; opacity: 0; } }

/* --- Влага: капля набухает, тянется, срывается; бусины поблёскивают ------- */
@keyframes xr-wet-fall { 0% { transform: translateY(0) scale(.3); opacity: 0; } 20% { opacity: 1; } 55% { transform: translateY(0) scale(1, 1); } 72% { transform: translateY(2px) scale(.9, 1.4); } 86% { transform: translateY(12px) scale(.8, 1.2); opacity: .9; } 100% { transform: translateY(22px) scale(.7, 1.1); opacity: 0; } }
@keyframes xr-twinkle { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
@keyframes xr-coat { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -95; } }

/* --- Бедро принимающего в тени — за плоскостью разреза, вместо чёрного ---- */
.xr-bd0 { stop-color: #8c5450; stop-opacity: .96; } .xr-bd1 { stop-color: #5e3538; stop-opacity: .8; } .xr-bd2 { stop-color: #2a161c; stop-opacity: 0; }
.xr-film.is-dark .xr-bd0 { stop-color: #3a272d; } .xr-film.is-dark .xr-bd1 { stop-color: #2c1e23; }
.xr-entry-in { fill: #b85870; filter: blur(.6px); }
.xr-entry-in.is-mouth { fill: #6e3242; }
.xr-hips, .xr-wrist, .xr-thigh { transform: none; }
@media (prefers-reduced-motion: no-preference) {
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-bead-hi { animation: xr-twinkle 1.6s ease-in-out infinite; }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on) .xr-wet-coat { animation: xr-coat calc(var(--beat1, 1s) * 3) linear infinite; }
  /* Бёдра дающего качаются вокруг корня члена; кисть — от запястья; бедро
     принимающего вздрагивает на ударе. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-hips { transform: rotate(calc(var(--sw, -1) * 2.4deg)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-wrist { transform: rotate(calc(var(--sw, -1) * .9deg)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-thigh { transform: translateX(calc(clamp(0, (var(--k, 1) - .8) * 5, 1) * 1.6px)) scaleY(calc(1 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .015)); }
}

/* =========================================================================
   ЕЩЁ ЖИЗНИ: ткани, румянец, пот, предсемя — всё от толчка (--k) и темпа
   ========================================================================= */
.xr-fl0 { stop-color: #ff7a9a; stop-opacity: .55; } .xr-fl1 { stop-color: #ff7a9a; stop-opacity: .2; } .xr-fl2 { stop-color: #ff7a9a; stop-opacity: 0; }
.xr-flush { opacity: 0; filter: blur(3px); }
.xr-sweat ellipse { fill: #fff; opacity: 0; filter: blur(.9px); }
.xr-precum { fill: #fffaf4; opacity: 0; filter: blur(.7px); }
.xr-os, .xr-cervix-canal { transform-box: fill-box; transform-origin: 0 50%; }
.xr-film.is-wet .xr-minora { transform-box: fill-box; transform-origin: 100% 50%; transform: scaleX(calc(1 + var(--wet, 0) * .14)); }
@keyframes xr-sweat { 0%, 100% { opacity: .1; transform: scale(.85); } 50% { opacity: .34; transform: scale(1.1); } }
@media (prefers-reduced-motion: no-preference) {
  /* Кожа у входа приливает: тем сильнее, чем влажнее, и вспыхивает на ударе. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-flush { opacity: calc(.34 + var(--wet, .3) * .2); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-flush { opacity: calc(.34 + var(--wet, .3) * .2 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .22); }
  /* Мягкие ткани у входа сминаются на ударе и расправляются на отходе. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-fat { stroke-width: calc(9px + clamp(0, (var(--k, 1) - .8) * 5, 1) * 2.2px); stroke-opacity: calc(.32 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .08); }
  /* Зев шейки приоткрывается на глубине. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-os { transform: scale(calc(1 + clamp(0, (var(--k, 1) - .85) * 6.6, 1) * .4), calc(1 + clamp(0, (var(--k, 1) - .85) * 6.6, 1) * 1.3)); }
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-cervix-hi { opacity: calc(.16 + clamp(0, (var(--k, 1) - .85) * 6.6, 1) * .2); }
  /* Малые губы набухают на ударе (чуть толще), клитор — следом. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .hud-xray-row[style*="--push:2.6"] .xr-film.is-wet .xr-minora { transform: scaleX(calc(1 + var(--wet, 0) * .14 + clamp(0, (var(--k, 1) - .8) * 5, 1) * .12)); }
  /* Пот мерцает вразнобой. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-sweat ellipse { transform-box: fill-box; transform-origin: center; animation: xr-sweat calc(var(--beat1, 1s) * 3) ease-in-out infinite; animation-delay: calc(var(--i, 0) * -.43s); }
  /* Капля предсемени набухает на глубине и тянется назад на отходе. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-film.is-wet .xr-precum { opacity: calc(var(--wet, 0) * clamp(0, (var(--k, 1) - .5) * 2, 1) * .55); transform: scale(calc(.7 + clamp(0, (var(--k, 1) - .5) * 2, 1) * .5)); transform-box: fill-box; transform-origin: 0 50%; }
}

/* =========================================================================
   РОТ: язык и горло. Всё от толчка (--k) и скорости (--v): язык
   прогибается под стволом и поднимается на отходе, кончик тянется за ним,
   горло волнами идёт за стволом и сжимается на глубине, язычок поджимается.
   ========================================================================= */
.xr-grip { fill: none; stroke: #ffd0dc; stroke-opacity: 0; stroke-linecap: round; stroke-dasharray: 6 14; filter: blur(2.2px); }
.xr-tongue-grp.is-oral { transform-box: fill-box; transform-origin: 100% 40%; }
@keyframes xr-swallow-run { 0% { stroke-dashoffset: 100; stroke-opacity: 0; } 14% { stroke-opacity: .3; } 80% { stroke-opacity: .3; } 100% { stroke-dashoffset: 0; stroke-opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  /* Язык: ствол вдавливает его на входе, на отходе он выпрямляется и чуть приподнимается. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-tongue-grp.is-oral { translate: 0 calc(var(--k, 1) * 1.9px - clamp(0, -1 * var(--v, 0), 1) * (1 - var(--k, 1)) * 1.1px); scale: calc(1 + (1 - var(--k, 1)) * .012) calc(1 - var(--k, 1) * .055); }
  /* Кончик языка тянется за стволом на отходе и возвращается на входе. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-lick.is-oral { translate: calc((1 - var(--k, 1)) * -3.4px) calc(clamp(0, -1 * var(--v, 0), 1) * -.9px); }
  /* Глоток катится по горлу плавно: появляется, идёт, гаснет — без рывка на повторе. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-swallow { stroke-opacity: 0; animation: xr-swallow-run calc(var(--beat1, 1s) * 2) ease-in-out infinite; }
  /* Горло идёт волнами за стволом и смыкается на глубине. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-grip { stroke-dashoffset: calc(var(--k, 1) * -20); stroke-opacity: calc(clamp(0, (var(--k, 1) - .15) * 1.7, 1) * .2); }
  /* Язычок поджимается к нёбу на глубине. */
  :is(.hud-tempo, .hud-xray.is-standalone):is(:hover, .fx-tap, .fx-on):not(.l0) .xr-uvula-sw { translate: 0 calc(clamp(0, (var(--k, 1) - .7) * 3.3, 1) * -1.3px); }
}

/* --- Телефон: подписи крупнее — картинка там ~0,8 от натуральной -------------- */
@media (max-width: 560px) {
  .xr-num { font-size: 8px; transform: translateY(.8px); }
  .xr-target-label { font-size: 8.6px; }
  .xr-end-label { font-size: 7.8px; }
  .xr-film { border-radius: 8px; }
}

/* --- Финал: кончает — фрикций нет, член стоит в глубине и пульсирует,
   точка в шапке бьётся в ритме выбросов; после — всё стоит, струи
   больше не бьют, остаётся лужа и потёк. ------------------------------- */
.hud-xray.is-climax .hud-xray-row, .hud-xray.is-after .hud-xray-row { --k: 1; --v: 0; }
.hud-xray.is-climax .hud-xray-pulse { opacity: 1; background: #fff6ea; box-shadow: 0 0 8px rgba(255,246,234,.8); }
.hud-xray.is-entry .hud-xray-pulse { opacity: .6; }
@keyframes xr-cum-pulse { 0%, 100% { transform: scale(.7); } 30% { transform: scale(1.25); } }
@media (prefers-reduced-motion: no-preference) {
  .hud-tempo:is(:hover, .fx-tap, .fx-on) .hud-xray.is-climax .hud-xray-pulse { animation: xr-cum-pulse .8s ease-out infinite; }
  .hud-tempo:is(:hover, .fx-tap, .fx-on) .hud-xray.is-climax .xr-glans { animation: xr-throb .8s ease-in-out infinite; }
  .hud-tempo:is(:hover, .fx-tap, .fx-on) .hud-xray.is-after :is(.xr-cum-drop, .xr-cum-jet) { animation: none; opacity: 0; }
  .hud-tempo:is(:hover, .fx-tap, .fx-on) .hud-xray.is-after .xr-glans { animation: none; }
}
/* Цвет темпа в финале — тёплый молочный, а не серо-синий «замерли». */
.hud-tempo:has(> .hud-xray.is-climax), .hud-tempo:has(> .hud-xray.is-after) { --tc: #f0d6c2; }


/* =========================================================================
   ПРЕЖНИЕ ТОЛЧКИ — по образцу «дразнит» и трения: тело движется, как
   движется на самом деле, ткани откликаются (render/xray.js: разрез → дуга).
   Ствол внутри канала не наклоняется — плоть не лезет за стенки.
